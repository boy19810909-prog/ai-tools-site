name: Update official finance news
on:
  schedule:
    # 07:17 and 19:17 in Taiwan (UTC+8).
    - cron: '17 23,11 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-news.yml'
      - 'scripts/update_official_news.py'
      - 'scripts/update_market_close.py'
permissions:
  contents: write
concurrency:
  group: official-finance-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh official finance headlines
        run: |
          python3 scripts/update_official_news.py
          python3 scripts/update_market_close.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/news.json data/market.json; then
            echo 'Nothing to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/news.json data/market.json
            git commit -m 'chore: refresh official news'
            git push
          fi
